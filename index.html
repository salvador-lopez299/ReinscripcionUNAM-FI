<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proceso de Reinscripción 2026-1 Facultad de Ingeniería</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      padding: 20px;
    }

    .container, .login-box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .login-box {
      max-width: 400px;
      margin-top: 80px;
    }

    h1, h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #007bff;
      color: white;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add { background: #28a745; color: white; }
    .remove { background: #dc3545; color: white; }
    .guardar { background: #007bff; color: white; margin-top: 10px; }

    .badge {
      background: #007bff;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h2> Sistema de Reinscripcion FI UNAM 2026-1</h2>
  <input type="text" id="usuario" placeholder="Usuario">
  <input type="password" id="password" placeholder="Contraseña">
  <button class="guardar" onclick="iniciarSesion()">Iniciar sesión</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<!-- SISTEMA -->
<div class="container hidden" id="sistema">
  <div class="top-bar">
    <h3>Lopez Alejandrez Salvador (32106462-4)</h3>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <h1>Selección de Materias 2026-1</h1>
  <p style="text-align:center; color:#666;"> Este registro se lleva a cabo en tiempo real</p>

  <!-- TABLA -->
  <table>
    <thead>
      <tr>
        <th>Materia</th>
        <th>Horario</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="materias"></tbody>
  </table>

  <h3>
    Materias seleccionadas
    <span class="badge" id="contador">0</span>
  </h3>

  <ul id="lista"></ul>

  <button class="guardar" onclick="guardarSeleccion()">
    Guardar selección
  </button>
</div>

<script>
  /* ---------- SESIÓN ---------- */
  function iniciarSesion() {
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("password").value;

    if (user === "321064624" && pass === "Svitar2005") {
      localStorage.setItem("sesion", "activa");
      mostrarSistema();
    } else {
      document.getElementById("error").textContent = "Credenciales incorrectas";
    }
  }

  function cerrarSesion() {
    localStorage.removeItem("sesion");
    location.reload();
  }

  function mostrarSistema() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("sistema").classList.remove("hidden");
  }

  if (localStorage.getItem("sesion") === "activa") {
    mostrarSistema();
  }

  /* ---------- MATERIAS ---------- */
  const materias = [
    { nombre: "Matemáticas I", horario: "Lun–Mie 08:00–10:00" },
    { nombre: "Física I", horario: "Mar–Jue 10:00–12:00" },
    { nombre: "Química", horario: "Lun–Mie 12:00–14:00" },
    { nombre: "Programación", horario: "Vie 08:00–12:00" },
    { nombre: "Ingeniería Básica", horario: "Mar 14:00–18:00" }
  ];

  const contenedor = document.getElementById("materias");
  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");

  let seleccionadas = [];

  function render() {
    contenedor.innerHTML = "";

    materias.forEach((m, i) => {
      const tr = document.createElement("tr");

      const tdMateria = document.createElement("td");
      tdMateria.textContent = m.nombre;

      const tdHorario = document.createElement("td");
      tdHorario.textContent = m.horario;

      const tdAccion = document.createElement("td");
      const btn = document.createElement("button");

      if (seleccionadas.includes(i)) {
        btn.textContent = "Quitar";
        btn.className = "remove";
        btn.onclick = () => quitar(i);
      } else {
        btn.textContent = "Agregar";
        btn.className = "add";
        btn.onclick = () => agregar(i);
      }

      tdAccion.appendChild(btn);

      tr.appendChild(tdMateria);
      tr.appendChild(tdHorario);
      tr.appendChild(tdAccion);

      contenedor.appendChild(tr);
    });

    lista.innerHTML = "";
    seleccionadas.forEach(i => {
      const li = document.createElement("li");
      li.textContent = materias[i].nombre + " - " + materias[i].horario;
      lista.appendChild(li);
    });

    contador.textContent = seleccionadas.length;
  }

  function agregar(i) {
    if (!seleccionadas.includes(i)) {
      seleccionadas.push(i);
    }
    render();
  }

  function quitar(i) {
    seleccionadas = seleccionadas.filter(x => x !== i);
    render();
  }

  function guardarSeleccion() {
    const seleccion = seleccionadas.map(i => materias[i]);
    localStorage.setItem("materias_guardadas", JSON.stringify(seleccion));
    alert("Selección guardada correctamente");
  }

  render();
</script>

</body>
</html>
